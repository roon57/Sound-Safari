<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#fff7f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sound Safari" />
  <title>Sound Safari 🎵</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #fff7f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #game {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px 16px 32px; text-align: center;
    }
    h1 { font-size: 28px; font-weight: 700; color: #2d2d2d; margin-bottom: 4px; }
    .subtitle { font-size: 16px; color: #777; margin-bottom: 20px; }
    #score-bar { display: flex; gap: 16px; margin-bottom: 20px; }
    .score-card {
      background: #fff; border-radius: 14px;
      padding: 10px 22px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); min-width: 90px;
    }
    .score-label { font-size: 12px; color: #999; }
    .score-val { font-size: 24px; font-weight: 700; color: #333; }
    #message { font-size: 26px; font-weight: 600; min-height: 44px; margin-bottom: 18px; color: #333; }
    #pads {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px; width: 100%; max-width: 400px; margin-bottom: 22px;
    }
    .pad {
      border-radius: 22px; height: 120px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; border: none;
      transition: transform 0.1s, filter 0.1s;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .pad:disabled { opacity: 0.55; }
    .pad:active:not(:disabled), .pad.lit { transform: scale(0.93); filter: brightness(1.12); }
    .pad .icon { font-size: 46px; line-height: 1; }
    .pad .name { font-size: 16px; font-weight: 600; margin-top: 6px; }
    .big-btn {
      font-size: 20px; font-weight: 600; padding: 14px 42px; border-radius: 50px;
      border: none; cursor: pointer; background: #ff8c61; color: #fff;
      box-shadow: 0 4px 14px rgba(255,140,97,0.35); transition: transform 0.1s;
    }
    .big-btn:active { transform: scale(0.96); }
    #install-banner {
      display: none; margin-top: 18px; background: #fff; border-radius: 14px;
      padding: 12px 18px; font-size: 14px; color: #555;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08); max-width: 340px; width: 100%;
    }
    #install-banner button {
      margin-top: 8px; background: #ff8c61; color: #fff;
      border: none; border-radius: 20px; padding: 8px 20px;
      font-size: 14px; cursor: pointer; font-weight: 600;
    }
    #ios-hint { display: none; margin-top: 14px; font-size: 13px; color: #888; max-width: 280px; }
  </style>
</head>
<body>
<div id="game">
  <h1>🎵 Sound Safari!</h1>
  <p class="subtitle">Listen, then tap the right animal!</p>
  <div id="score-bar">
    <div class="score-card"><div class="score-label">⭐ Stars</div><div class="score-val" id="stars">0</div></div>
    <div class="score-card"><div class="score-label">🎯 Round</div><div class="score-val" id="round-disp">1/5</div></div>
  </div>
  <div id="message">🎧 Press Start!</div>
  <div id="pads"></div>
  <button class="big-btn" id="start-btn" onclick="startGame()">▶ Start!</button>
  <button class="big-btn" id="replay-btn" onclick="startGame()" style="display:none;">🔄 Play Again!</button>
  <div id="install-banner">
    📲 Install Sound Safari on your home screen!
    <br><button id="install-btn">Install App</button>
  </div>
  <p id="ios-hint">📲 Tap <strong>Share</strong> → <strong>Add to Home Screen</strong></p>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function C() { if (!actx) actx = new AudioCtx(); return actx; }

const ALL_ANIMALS = [
  {
    name:"Frog", icon:"🐸", bg:"#ffc1cc", tc:"#7a3040",
    play(){
      const c=C(),t=c.currentTime;
      for(let i=0;i<3;i++){
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.frequency.setValueAtTime(300,t+i*0.25);
        o.frequency.linearRampToValueAtTime(190,t+i*0.25+0.12);
        g.gain.setValueAtTime(0.4,t+i*0.25);
        g.gain.linearRampToValueAtTime(0,t+i*0.25+0.15);
        o.start(t+i*0.25);o.stop(t+i*0.25+0.2);
      }
    }
  },
  {
    name:"Bird", icon:"🐦", bg:"#b5d4f4", tc:"#1a5f9e",
    play(){
      const c=C(),t=c.currentTime;
      for(let i=0;i<5;i++){
        const o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.connect(g);g.connect(c.destination);
        o.frequency.setValueAtTime(1200+Math.random()*400,t+i*0.15);
        o.frequency.linearRampToValueAtTime(1700+Math.random()*200,t+i*0.15+0.1);
        g.gain.setValueAtTime(0.3,t+i*0.15);
        g.gain.linearRampToValueAtTime(0,t+i*0.15+0.12);
        o.start(t+i*0.15);o.stop(t+i*0.15+0.14);
      }
    }
  },
  {
    name:"Bee", icon:"🐝", bg:"#ffd59e", tc:"#7a4800",
    play(){
      const c=C(),o=c.createOscillator(),g=c.createGain();
      o.type='sawtooth';o.frequency.value=200;
      o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(0.2,c.currentTime+0.05);
      g.gain.setValueAtTime(0.2,c.currentTime+0.55);
      g.gain.linearRampToValueAtTime(0,c.currentTime+0.7);
      o.start(c.currentTime);o.stop(c.currentTime+0.75);
    }
  },
  {
    name:"Cat", icon:"🐱", bg:"#c0dd97", tc:"#3b6d11",
    play(){
      const c=C(),o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.connect(g);g.connect(c.destination);
      o.frequency.setValueAtTime(600,c.currentTime);
      o.frequency.linearRampToValueAtTime(900,c.currentTime+0.25);
      o.frequency.linearRampToValueAtTime(700,c.currentTime+0.55);
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(0.35,c.currentTime+0.05);
      g.gain.setValueAtTime(0.35,c.currentTime+0.45);
      g.gain.linearRampToValueAtTime(0,c.currentTime+0.6);
      o.start(c.currentTime);o.stop(c.currentTime+0.65);
    }
  },
  {
    name:"Duck", icon:"🦆", bg:"#a8e6cf", tc:"#1a5c40",
    play(){
      const c=C(),t=c.currentTime;
      for(let i=0;i<2;i++){
        const o=c.createOscillator(),g=c.createGain();
        o.type='sawtooth';o.connect(g);g.connect(c.destination);
        o.frequency.setValueAtTime(500,t+i*0.35);
        o.frequency.linearRampToValueAtTime(350,t+i*0.35+0.2);
        g.gain.setValueAtTime(0.3,t+i*0.35);
        g.gain.linearRampToValueAtTime(0,t+i*0.35+0.22);
        o.start(t+i*0.35);o.stop(t+i*0.35+0.25);
      }
    }
  },
  {
    name:"Dog", icon:"🐶", bg:"#f4d9b0", tc:"#7a4000",
    play(){
      const c=C(),t=c.currentTime;
      for(let i=0;i<2;i++){
        const o=c.createOscillator(),g=c.createGain();
        o.type='sawtooth';o.connect(g);g.connect(c.destination);
        o.frequency.setValueAtTime(220,t+i*0.38);
        o.frequency.linearRampToValueAtTime(160,t+i*0.38+0.15);
        g.gain.setValueAtTime(0.45,t+i*0.38);
        g.gain.linearRampToValueAtTime(0,t+i*0.38+0.18);
        o.start(t+i*0.38);o.stop(t+i*0.38+0.2);
      }
    }
  },
  {
    name:"Lion", icon:"🦁", bg:"#f9c784", tc:"#7a3800",
    play(){
      const c=C(),t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.type='sawtooth';o.connect(g);g.connect(c.destination);
      o.frequency.setValueAtTime(80,t);
      o.frequency.linearRampToValueAtTime(120,t+0.2);
      o.frequency.linearRampToValueAtTime(60,t+0.7);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.5,t+0.1);
      g.gain.setValueAtTime(0.5,t+0.5);
      g.gain.linearRampToValueAtTime(0,t+0.85);
      o.start(t);o.stop(t+0.9);
    }
  },
  {
    name:"Cow", icon:"🐮", bg:"#d4eac8", tc:"#2e5c1a",
    play(){
      const c=C(),t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.connect(g);g.connect(c.destination);
      o.frequency.setValueAtTime(160,t);
      o.frequency.linearRampToValueAtTime(140,t+0.4);
      o.frequency.linearRampToValueAtTime(120,t+0.8);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.4,t+0.05);
      g.gain.setValueAtTime(0.4,t+0.65);
      g.gain.linearRampToValueAtTime(0,t+0.9);
      o.start(t);o.stop(t+0.95);
    }
  },
  {
    name:"Elephant", icon:"🐘", bg:"#cfc8e8", tc:"#3c2f7a",
    play(){
      const c=C(),t=c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.type='sawtooth';o.connect(g);g.connect(c.destination);
      o.frequency.setValueAtTime(200,t);
      o.frequency.linearRampToValueAtTime(700,t+0.15);
      o.frequency.linearRampToValueAtTime(400,t+0.45);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.4,t+0.05);
      g.gain.setValueAtTime(0.4,t+0.35);
      g.gain.linearRampToValueAtTime(0,t+0.55);
      o.start(t);o.stop(t+0.6);
    }
  },
  {
    name:"Eagle", icon:"🦅", bg:"#b8d8f8", tc:"#0c3d6e",
    play(){
      const c=C(),t=c.currentTime;
      for(let i=0;i<3;i++){
        const o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.connect(g);g.connect(c.destination);
        o.frequency.setValueAtTime(2000-i*200,t+i*0.22);
        o.frequency.linearRampToValueAtTime(1200-i*150,t+i*0.22+0.18);
        g.gain.setValueAtTime(0.3,t+i*0.22);
        g.gain.linearRampToValueAtTime(0,t+i*0.22+0.2);
        o.start(t+i*0.22);o.stop(t+i*0.22+0.22);
      }
    }
  }
];

const TOTAL=5;
let round=0,stars=0,current=-1,busy=false,activeAnimals=[];

function pickAnimals(){
  return [...ALL_ANIMALS].sort(()=>Math.random()-0.5).slice(0,4);
}

function renderPads(animals){
  const el=document.getElementById('pads');
  el.innerHTML='';
  animals.forEach((a,i)=>{
    const btn=document.createElement('button');
    btn.className='pad';btn.id='pad-'+i;
    btn.style.background=a.bg;btn.disabled=true;
    btn.innerHTML=`<span class="icon">${a.icon}</span><span class="name" style="color:${a.tc}">${a.name}</span>`;
    btn.onclick=()=>guess(i);
    el.appendChild(btn);
  });
}

function setPads(on){
  for(let i=0;i<4;i++){const p=document.getElementById('pad-'+i);if(p)p.disabled=!on;}
}
function flashPad(idx){
  const p=document.getElementById('pad-'+idx);if(!p)return;
  p.classList.add('lit');setTimeout(()=>p.classList.remove('lit'),320);
}
function setMsg(t){document.getElementById('message').textContent=t;}

function startGame(){
  round=0;stars=0;
  document.getElementById('stars').textContent='0';
  document.getElementById('start-btn').style.display='none';
  document.getElementById('replay-btn').style.display='none';
  nextRound();
}

function nextRound(){
  if(round>=TOTAL){endGame();return;}
  busy=false;
  activeAnimals=pickAnimals();
  current=Math.floor(Math.random()*4);
  renderPads(activeAnimals);
  document.getElementById('round-disp').textContent=(round+1)+'/'+TOTAL;
  setMsg('🔊 Listen...');
  setTimeout(()=>{
    flashPad(current);
    activeAnimals[current].play();
    setTimeout(()=>{setMsg('👆 Which animal?');setPads(true);},950);
  },500);
}

function guess(idx){
  if(busy)return;
  busy=true;setPads(false);
  flashPad(idx);activeAnimals[idx].play();
  if(idx===current){
    stars++;document.getElementById('stars').textContent=stars;
    setMsg('🌟 Yes! Great job!');
  } else {
    setMsg('💙 Almost! Listen again!');
    setTimeout(()=>{flashPad(current);activeAnimals[current].play();},300);
  }
  round++;
  setTimeout(()=>nextRound(),1600);
}

function endGame(){
  setPads(false);
  const msgs=['🎉 Amazing!','🌈 Superstar!','🏆 Wonderful!','🥳 You rock!'];
  setMsg(msgs[Math.floor(Math.random()*msgs.length)]+' '+stars+'/'+TOTAL+' stars!');
  document.getElementById('replay-btn').style.display='inline-block';
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-banner').style.display='block';
});
document.getElementById('install-btn').addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted')document.getElementById('install-banner').style.display='none';
  deferredPrompt=null;
});

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone;
if(isIOS)document.getElementById('ios-hint').style.display='block';
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
